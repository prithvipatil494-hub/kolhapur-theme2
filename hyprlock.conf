# Kolhapur Theme — Hyprlock

background {
    path = ~/.config/omarchy/current/theme/backgrounds/kolhapur-01.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

input-field {
    size = 260, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    outer_color = rgba(C98A2Cee)
    inner_color = rgba(1C1210ee)
    font_color = rgba(F1E7D0ee)
    placeholder_text = <span foreground="##B8A98F">Enter password...</span>
    check_color = rgba(6E8F4Fee)
    fail_color = rgba(B33A3Aee)
    position = 0, -20
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(F1E7D0ee)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgba(C98A2Cee)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
